name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # goreleaser needs the full history and tags for the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      # A tag must never publish binaries from a commit that fails its own
      # tests. CI runs on master too, but a tag can point anywhere.
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@v0.23.0

      - name: Test
        run: go test -race ./...

      # The release body is generated from Conventional Commit subjects,
      # grouped by type (see `changelog` in .goreleaser.yaml).
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
